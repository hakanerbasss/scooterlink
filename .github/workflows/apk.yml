# Elle çalışır: Actions -> APK derle -> Run workflow.
# Secret gerekmez; debug imzalı APK üretir ve Release olarak yayınlar.
name: APK derle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK derle
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|[Ee]xception|FAILURE|unresolved reference|Unresolved reference" build.log | tail -60 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | cut -c1-500)
              echo "::error::$safe"
            done
            exit $code
          fi

      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release create "apk-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "ScooterLink ${{ github.run_number }}" \
            --notes "Telefona indirip kur." \
            --repo "${{ github.repository }}" 2> relerr.txt
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < relerr.txt
            exit $code
          fi
